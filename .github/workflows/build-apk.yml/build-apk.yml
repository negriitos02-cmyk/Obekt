name: Build OBEKT 09 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o OBEKT_09_Android_Project.zip -d project
          cp project/build.gradle project/settings.gradle project/gradle.properties .
          cp -r project/app .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OBEKT_09_APK
          path: app/build/outputs/apk/debug/app-debug.apk
